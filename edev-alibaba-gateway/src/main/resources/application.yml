spring:
  application:
    name: service-gateway
  profiles:
    active: dev
  config:
    import: "optional:nacos:service-gateway.yaml"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        file-extension: yaml
    sentinel:
      transport:
        dashboard: localhost:8858
      eager: true
    gateway:
      routes:
        - id: customer
          uri: lb://service-customer
          predicates:
            - Path=/customer/**
          filters:
            - StripPrefix=1
        - id: product
          uri: lb://service-product
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        - id: order
          uri: lb://service-order
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        - id: inventory
          uri: lb://service-inventory
          predicates:
            - Path=/inventory/**
          filters:
            - StripPrefix=1
        - id: authority
          uri: lb://service-authority
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
server:
  port: 9009
management:
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  level:
    com.alibaba.nacos: WARN
---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USR:nacos}
        password: ${NACOS_PWD:nacos}
      config:
        server-addr: ${NACOS_ADDR}
        file-extension: yaml
server:
  port: ${SERVICE_PORT:9009}
---
spring:
  config:
    activate:
      on-profile: kafka
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
        refresh-enabled: false
    sentinel:
      enabled: false
      auto-refresh: false
      eager: false
server:
  port: ${SERVICE_PORT:9009}
logging:
  config: classpath:logback-docker.xml
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
        refresh-enabled: false
    sentinel:
      enabled: false
      auto-refresh: false
      eager: false
    gateway:
      routes:
        - id: customer
          uri: http://localhost:9002
          predicates:
            - Path=/customer/**
          filters:
            - StripPrefix=1
        - id: product
          uri: http://localhost:9003
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        - id: order
          uri: http://localhost:9005
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        - id: inventory
          uri: http://localhost:9004
          predicates:
            - Path=/inventory/**
          filters:
            - StripPrefix=1
        - id: authority
          uri: http://localhost:9006
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
server:
  port: 9009
management:
  endpoints:
    web:
      exposure:
        include: '*'