spring:
  application:
    name: service-authority
  profiles:
    active: dev
  config:
    import: "optional:nacos:service-authority.yaml"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
mybatis:
  mapperLocations: classpath*:mapper/*Mapper.xml
security:
  passwordEncoder: noop
  loginUrl: http://localhost:8080
  whiteListUrls: /login,/logout,/user/register,/orm/**,/query/**,/list/**,/actuator/**,/userinfo
logging:
  level:
    com.edev.support: INFO
    com.edev.support.dao: DEBUG
    com.edev.support.cache: DEBUG
    com.alibaba: WARN
---
spring:
  profiles: dev
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        file-extension: yaml
    sentinel:
      transport:
        dashboard: localhost:8858
      eager: true
  datasource:
    url: jdbc:mysql://master:32306/edevAuthority?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: auth
    password: auth1234
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      database: 0
      host: kubernetes
      port: 31379
      password: redis1234
      timeout: 1000
server:
  port: 9006
management:
  endpoints:
    web:
      exposure:
        include: '*'
coke:
  jwt:
    header: Authorization
    expire: 604800
    secret: secretkey
---
spring:
  profiles: docker
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USR:nacos}
        password: ${NACOS_PWD:nacos}
      config:
        server-addr: ${NACOS_ADDR}
        file-extension: yaml
server:
  port: ${SERVICE_PORT:9006}